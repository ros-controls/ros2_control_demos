name: Rolling Semi-Binary Build
# description: 'Build & test that compiles the main dependencies from source.'

on:
  pull_request: &event
    branches:
      - master
    paths:
      - '**.hpp'
      - '**.cpp'
      - '.github/workflows/rolling-semi-binary-build.yml'
      - '**/package.xml'
      - '**/CMakeLists.txt'
      - '**.xacro'
      - '**.py'
      - '**.yaml'
      - 'ros2_control_demos.rolling.repos'
      - 'ros2_control_demos.lyrical.repos'
      - 'ros2_control_demos.kilted.repos'
      - '**.xml'
  push: *event
  schedule:
    # Run every morning to detect flakiness and broken dependencies
    - cron: '33 1 * * MON-FRI'

jobs:
  semi_binary:
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-industrial-ci-with-cache.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [rolling, lyrical, kilted]
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}
      ros_repo: testing
      upstream_workspace: ros2_control_demos.${{ matrix.ROS_DISTRO }}.repos
      # mujoco_ros2_control is also pinned to build from source (see the .repos files above);
      # without this, rosdep can pull in the stale binary package and shadow the from-source build.
      rosdep_skip_keys: mujoco_ros2_control mujoco_ros2_control_msgs mujoco_ros2_control_plugins
      ref_for_scheduled_build: master
